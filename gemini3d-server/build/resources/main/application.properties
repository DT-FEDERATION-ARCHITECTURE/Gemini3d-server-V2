# ═══════════════════════════════════════════════════════════
# Gemini3D Server Configuration
# ═══════════════════════════════════════════════════════════

server.port=8080

# Trace files directory (pre-loaded CSVs)
gemini3d.traces.directory=traces

# Max upload size for CSV files
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Emulator speed (ms between readings, 0 = full speed)
gemini3d.emulator.period-ms=500
